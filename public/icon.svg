  <!-- 1. Outer Double Blue Border -->
  <circle cx="250" cy="250" r="242" stroke="#0284c7" stroke-width="8" fill="#ffffff" />
  <circle cx="250" cy="250" r="236" stroke="#0369a1" stroke-width="2" fill="none" />

