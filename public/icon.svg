  <path d="M 252 200 C 265 205 272 215 265 225 C 258 235 242 235 235 245 C 228 255 235 265 248 270 C 260 275 265 285 258 295 C 254 300 250 302 250 302" stroke="#0284c7" stroke-width="2.5" fill="none" />

