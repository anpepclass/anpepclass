  <path d="M 250 316 C 215 296 170 298 152 304 L 156 295 C 180 286 220 284 250 302 C 280 284 320 286 344 295 L 348 304 C 330 298 285 296 250 316 Z" fill="url(#bookYellow)" />

  <!-- ANPEP CLASSES Text -->
  <text x="250" y="368" text-anchor="middle" fill="#ffffff" font-size="36" font-weight="900" font-family="'Times New Roman', serif" letter-spacing="4">ANPEP</text>
  <text x="250" y="384" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700" font-family="'Plus Jakarta Sans', sans-serif" letter-spacing="5">CLASSES</text>
